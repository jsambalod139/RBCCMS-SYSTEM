<main class="login-container">
  <div class="login-layout">
    <section class="system-introduction" aria-label="About the system">
      <h1>
        Remote Barangay<br />
        Community Concern<br />
        Reporting and<br />
        Monitoring System
      </h1>
    </section>

    <section class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <img
          src="assets/images/dashboard_logo.png"
          alt="Municipality of Villanueva seal"
          class="municipal-logo"
          width="96"
          height="96"
        />

        <h2 id="login-title">Welcome to RBCCMS</h2>
        <p>Sign in to your account</p>
      </header>

      <form #loginForm="ngForm" (ngSubmit)="login()">
        <div class="form-group">
          <label for="email" class="visually-hidden">
            Email address
          </label>

          <div class="input-wrapper">
            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="3" />
              <path d="m4 7 8 6 8-6" />
            </svg>

            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Email address"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              required
              email
              [disabled]="loading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="visually-hidden">
            Password
          </label>

          <div class="input-wrapper">
            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <rect x="4" y="10" width="16" height="11" rx="3" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              <path d="M12 14v3" />
            </svg>

            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Password"
              autocomplete="current-password"
              required
              [disabled]="loading()"
            />
          </div>
        </div>

        <button
          type="submit"
          class="btn-login"
          [class.is-loading]="loading()"
          [disabled]="loading() || loginForm.invalid"
          [attr.aria-busy]="loading()"
        >
          @if (loading()) {
            <span
              class="login-spinner"
              aria-hidden="true"
            ></span>
          }

          <span aria-live="polite">
            {{ loading() ? 'Signing in...' : 'Login' }}
          </span>
        </button>
      </form>

      <footer class="login-footer">
        <p>
          Need help?
          <strong>Contact the barangay.</strong>
        </p>
      </footer>
    </section>
  </div>
</main>
