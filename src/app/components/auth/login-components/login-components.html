<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <i class=""></i>
      </div>

      <h1>
        Remote Barangay Community Concern Reporting and Monitoring System
      </h1>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="login()">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="email-input"></i>

          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Email Address"
            autocomplete="email"
            required
            email
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <i class="password-input"></i>

          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            [disabled]="loading()"
          />
        </div>
      </div>

      <button
        type="submit"
        class="btn-login"
        [disabled]="loading() || loginForm.invalid"
      >
        {{ loading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
