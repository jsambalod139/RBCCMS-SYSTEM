<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <i class=""></i>
      </div>
      <h1>Remote Barangay Communication Concern Reporting and Monitoring System</h1>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="email-input"></i>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Email Address"
            autocomplete="emailng"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <i class="password-input"></i>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Password"
            autocomplete="current-password"
          />
        </div>
      </div>
      
       <button type="submit" class="btn-login">Sign In</button>
    </form>
  </div>
</div>
