<div class="app-layout">
  <div class="sidenav">
    <div class="logo">
      <img
        src="assets/images/dashboard_logo.png"
        alt="Logo"
        width="150"
      />
    </div>

    <div class="sidenav-header">
      <h2><i class="cpu"></i></h2>
    </div>

    <nav>
      <ul>
        <li>
          <a routerLink="/perso-dashboard/personnel-dashboard">
            <i class="pi pi-home" aria-hidden="true"></i>
            Dashboard
          </a>
        </li>

        <li>
          <a routerLink="/perso-dashboard/personnel-myprofile">
            <i class="pi pi-user" aria-hidden="true"></i>
            My Profile
          </a>
        </li>

        <li>
          <a routerLink="/perso-dashboard/personnel-concern">
            <i class="pi pi-plus" aria-hidden="true"></i>
            Concerns
          </a>
        </li>

        <li>
          <a routerLink="/perso-dashboard/personnel-reports">
            <i class="pi pi-comment" aria-hidden="true"></i>
            Reports
          </a>
        </li>

        @if (canManageResidents()) {
          <li>
            <a routerLink="/perso-dashboard/personnel-residents">
              <i class="pi pi-user" aria-hidden="true"></i>
              Residents
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</div>
