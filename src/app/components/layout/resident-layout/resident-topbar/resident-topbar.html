<nav class="dashboard-topbar">
  <div class="topbar-left">
    <h1>Welcome to RBCCMS!</h1>
  </div>

  <div class="topbar-right">
    <div class="profile-wrapper" (click)="toggleMenu()">
      <img
        src="https://i.pravatar.cc/100"
        class="avatar"
        alt="Profile"
      />

      <div
        class="dropdown"
        *ngIf="isMenuOpen"
        (click)="$event.stopPropagation()"
      >
        <div class="profile-info">
          <img
            src="https://i.pravatar.cc/100"
            class="avatar"
            alt="Profile"
          />

          <span>Jon Charles</span>
        </div>

        <button
          type="button"
          class="menu-item logout"
          (click)="logout($event)"
          [disabled]="loggingOut()"
          [attr.aria-busy]="loggingOut()"
        >
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          {{ loggingOut() ? 'Please wait...' : 'Log out' }}
        </button>
      </div>
    </div>
  </div>
</nav>
