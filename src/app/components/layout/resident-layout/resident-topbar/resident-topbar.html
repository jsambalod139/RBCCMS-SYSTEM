<nav class="dashboard-topbar" aria-label="Resident header">
  <div class="topbar-left">
    <h1>Welcome to RBCCMS!</h1>
  </div>

  <div class="topbar-right">
    <app-notifications
      (opened)="closeMenu()"
    ></app-notifications>

    <div class="profile-wrapper">
      <button
        type="button"
        class="profile-trigger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="resident-profile-dropdown"
        aria-label="Open account options"
        [disabled]="loggingOut()"
      >
        @if (account.photoUrl()) {
          <img
            [src]="account.photoUrl()"
            class="avatar"
            alt=""
            (error)="account.imageFailed()"
          />
        } @else {
          <span
            class="avatar avatar-initials"
            aria-hidden="true"
          >
            {{ account.initials() }}
          </span>
        }
      </button>

      @if (isMenuOpen()) {
        <div
          id="resident-profile-dropdown"
          class="dropdown"
        >
          <div class="profile-info">
            @if (account.photoUrl()) {
              <img
                [src]="account.photoUrl()"
                class="avatar"
                alt=""
                (error)="account.imageFailed()"
              />
            } @else {
              <span
                class="avatar avatar-initials"
                aria-hidden="true"
              >
                {{ account.initials() }}
              </span>
            }

            <div class="profile-text">
              <span class="profile-name">
                {{ account.profile()?.name || 'Resident' }}
              </span>
              <span class="profile-role">Resident</span>
            </div>
          </div>

          <a
            class="menu-item"
            routerLink="/res-dashboard/resident-settings"
            (click)="closeMenu()"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"
              />
            </svg>

            Settings
          </a>

          <button
            type="button"
            class="menu-item logout"
            (click)="logout($event)"
            [disabled]="loggingOut()"
            [attr.aria-busy]="loggingOut()"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path
                d="M9 4H4v16h5M10 12h11m-4-4 4 4-4 4"
              />
            </svg>

            {{
              loggingOut()
                ? 'Please wait...'
                : 'Log out'
            }}
          </button>
        </div>
      }
    </div>
  </div>
</nav>
